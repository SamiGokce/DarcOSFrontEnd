# CS452ROTOS dev container — docker compose up
name: darcyos-platform

services:
  darcyos-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: darcyos-dev
    container_name: darcyos-dev
    hostname: darcyos-dev
    user: cs452
    working_dir: /workspace
    ports:
      - "${VSCODE_PORT:-8080}:8080"
    volumes:
      - .:/workspace
    command: ["/usr/local/bin/start-vscode.sh", "/workspace"]
