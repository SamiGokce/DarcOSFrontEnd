timeout 15
default arch

menuentry "DarcOS" {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    options archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G
}

menuentry "DarcOS (nomodeset)" {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    options archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G nomodeset
}
