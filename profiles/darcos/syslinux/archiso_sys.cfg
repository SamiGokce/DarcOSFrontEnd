DEFAULT DarcOS
TIMEOUT 60
PROMPT 0

# Default: a plain, reliable boot. (Integrity check + RAM are options below so a
# slow/odd verify can never strand you in emergency mode by default.)
LABEL DarcOS
MENU LABEL DarcOS
MENU DEFAULT
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G splash

# Verify the live image's integrity, then boot.
LABEL DarcOSverify
MENU LABEL DarcOS  (verify integrity, then boot)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% checksum=y cow_spacesize=4G splash

# Trial: copy the whole OS into RAM, then run from memory (USB can be removed).
LABEL DarcOSram
MENU LABEL DarcOS  (trial - load fully into RAM)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram=y cow_spacesize=4G splash

LABEL DarcOSnomodeset
MENU LABEL DarcOS  (nomodeset)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset cow_spacesize=4G splash
