# mkinitcpio configuration for the DarcOS live ISO initramfs.
# The `archiso` hook is what finds the boot media, mounts the squashfs
# airootfs, and sets up the overlay so switch-root can hand off to the live
# system. Without it the initramfs drops to emergency mode.
MODULES=()
BINARIES=()
FILES=()
HOOKS=(base udev modconf kms memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
