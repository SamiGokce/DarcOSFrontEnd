# DarcOS voice I/O — lets you talk to (and install) the OS by voice.

# Speech-to-text (hear you):
#   whisper     — local whisper.cpp, offline, no key
#   elevenlabs  — ElevenLabs Scribe (cloud, needs key + network)
STT_ENGINE="whisper"

# Text-to-speech (Samantha's voice):
#   piper       — local Piper, offline, no key
#   elevenlabs  — ElevenLabs (cloud, best quality, needs key + network)
TTS_ENGINE="piper"

# ElevenLabs credentials (set with `darcos setup`). Required only when an
# engine above is set to elevenlabs.
ELEVENLABS_API_KEY=""
# Voice id; empty → use the active persona's voice mapping.
ELEVENLABS_VOICE_ID=""

# Optional wake word ("" = push-to-talk / always-listen handled by the client).
WAKE_WORD=""
