# DarcOS agent daemon configuration — the OS-as-harness brain.

# Reasoning engine: rule (offline fallback) | hermes | claude
ENGINE="rule"

# Autonomy level (how much runs WITHOUT asking):
#   act     — reads + mutations run automatically, narrated after (default)
#   confirm — ask yes/no before any system change
#   suggest — propose only; never execute without approval
# Destructive ops (wipe/mkfs/userdel/...) ALWAYS require explicit consent.
AUTONOMY="act"

# Model id when ENGINE uses a hosted backend.
MODEL="claude-opus-4-8"

# Personality driving the agent (see /usr/share/darcos/personas/*.json):
#   samantha — warm, present, Her-like (default)   darc — calm operator
PERSONA="samantha"

# SOCKET / AUDIT auto-resolve (/run/darcos, /var/log/darcos) when empty.
SOCKET=""
AUDIT=""
